<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="1IO6DARE2tmtY6UgOyPrumKuu2tA0K8Vehn0aZK0DSA" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>S&A Treasures | Aesthetic & Herbal Collection</title>
    <meta name="description" content="Explore S&A Treasures for Aesthetic Beaded Wristlets, Character Phone Straps, and premium Livalia Herbal Soaps & Shampoos at the best prices with free home delivery in Bangladesh.">
    
    <!-- 🌟 নতুন লোগো ট্যাব আইকন (Favicon) -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/4yJdwXKp/Gemini-Generated-Image-r2qw9dr2qw9dr2qw.png">
    
    <meta property="og:title" content="S&A Treasures | Aesthetic & Herbal Collection">
    <meta property="og:description" content="Love yourself, buy gifts, and spread happiness among your loved ones. ✨ Get free home delivery all over Bangladesh!">
    
    <!-- 🌟 সোশ্যাল মিডিয়া প্রিভিউ লোগো লিংক -->
    <meta property="og:image" content="https://i.postimg.cc/4yJdwXKp/Gemini-Generated-Image-r2qw9dr2qw9dr2qw.png">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b143c;       /* Premium Burgundy / Deep Luxury Wine */
            --primary-hover: #260a27; /* Darker Burgundy */
            --bg-color: #FFF9FB;      /* Super Soft Sakura Tinted White */
            --card-bg: #ffffff;
            --text-main: #2d2d2d;     /* Dark Charcoal for readability */
            --accent: #FBCCE7;        /* Premium Sakura Blossom Pink */
            --success: #3b82f6; 
            --success-hover: #2563eb;
            --input-focus: #3b143c;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
        }
        
        .shipping-banner { 
            background: linear-gradient(90deg, var(--primary), #5c265e); 
            color: white; 
            text-align: center; 
            padding: 12px; 
            font-weight: bold; 
            font-size: 0.95em; 
            position: sticky; top: 0; z-index: 99; 
            box-shadow: 0 2px 10px rgba(59, 20, 60, 0.15);
        }
        
        header { 
            padding: 50px 20px; 
            background: #fff; 
            text-align: center; 
            border-bottom: 2px solid rgba(251, 204, 231, 0.3); 
        }
        
        .logo-container { margin-bottom: 15px; }
        
        /* 🌟 নতুন লোগোর জন্য প্রিমিয়াম কার্ভড স্কয়ার শেপ */
        .business-logo { 
            width: 130px; height: 130px; 
            border-radius: 15px; object-fit: cover; 
            box-shadow: 0 6px 15px rgba(59, 20, 60, 0.1); 
            border: 3px solid var(--primary);
        }
        
        h1 { color: var(--primary); margin: 0; font-size: 2.5em; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
        .tagline { color: #64748b; font-style: italic; margin-top: 10px; font-size: 1.1em; }

        .filter-container {
            max-width: 900px;
            width: 90%;
            margin: 30px auto 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            background: #fff;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            border: 1px solid var(--accent);
            box-sizing: border-box;
        }
        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95em;
            outline: none;
            background: #fafafa;
            transition: 0.2s;
        }
        .search-input:focus {
            border-color: var(--input-focus);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(251, 204, 231, 0.5);
        }
        
        .cart-float { 
            position: fixed; bottom: 95px; right: 20px; 
            background-color: var(--primary); color: white; 
            width: 60px; height: 60px; border-radius: 50px; 
            text-align: center; font-size: 24px; 
            box-shadow: 0 4px 15px rgba(59, 20, 60, 0.3); 
            z-index: 100; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; border: none; cursor: pointer; transition: 0.3s ease;
        }
        .cart-float:hover { transform: scale(1.05); background-color: var(--primary-hover); }
        .cart-count { position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; font-size: 12px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; }

        /* কাস্টমার তথ্য সাবমিশন ফরম স্টাইল */
        .order-form-container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--accent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 10px;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(251, 204, 231, 0.5);
        }
        .submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .submit-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="shipping-banner">
        🎉 সারা বাংলাদেশে ফ্রি হোম ডেলিভারি! ক্যাশ অন ডেলিভারি সুবিধা! 🎉
    </div>

    <header>
        <div class="logo-container">
            <!-- 🌟 মেইন হেডার নতুন লোগো ইমেজ -->
            <img src="https://i.postimg.cc/4yJdwXKp/Gemini-Generated-Image-r2qw9dr2qw9dr2qw.png" class="business-logo" alt="S&A Treasures Logo">
        </div>
        <h1>S&A Treasures</h1>
        <div class="tagline">Love yourself, buy gifts, and spread happiness among your loved ones. ✨</div>
    </header>

    <!-- কাস্টমার অর্ডার সাবমিশন ফরম -->
    <div class="order-form-container">
        <h2 style="text-align: center; color: var(--primary); margin-top: 0;">অর্ডার নিশ্চিত করুন</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="custName">আপনার নাম *</label>
                <input type="text" id="custName" required placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label for="custPhone">মোবাইল নম্বর *</label>
                <input type="tel" id="custPhone" required placeholder="017XXXXXXXX">
            </div>
            <div class="form-group">
                <label for="custEmail">ইমেইল ঠিকানা (এখানে রসিদ পাঠানো হবে) *</label>
                <input type="email" id="custEmail" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="custAddress">ডেলিভারি ঠিকানা *</label>
                <textarea id="custAddress" rows="3" required placeholder="গ্রাম/রোড, থানা, জেলা"></textarea>
            </div>
            <div class="form-group">
                <label for="productItems">পণ্যসমূহ ও পরিমাণ *</label>
                <input type="text" id="productItems" required placeholder="যেমন: Beaded Wristlet - 1pc">
            </div>
            <div class="form-group">
                <label for="totalBill">মোট বিল (টাকা) *</label>
                <input type="text" id="totalBill" required placeholder="যেমন: 1200 TK">
            </div>
            <div class="form-group">
                <label for="advanceAmount">অগ্রিম পেমেন্ট (যদি থাকে)</label>
                <input type="text" id="advanceAmount" placeholder="0 TK">
            </div>
            <div class="form-group">
                <label for="paymentInfo">পেমেন্ট রেফারেন্স (বিকাশ/নগদ ট্রানজেকশন আইডি)</label>
                <input type="text" id="paymentInfo" placeholder="TrxIDXXXXXX">
            </div>
            <div class="form-group">
                <label for="staffCode">স্টাফ/রেফারেল কোড (ঐচ্ছিক)</label>
                <input type="text" id="staffCode" placeholder="যেমন: STAFF10">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">অর্ডার প্লেস করুন</button>
        </form>
    </div>

    <!-- ফ্লোটিং কার্ট বাটন -->
    <button class="cart-float">
        <i class="fa-solid fa-shopping-bag"></i>
        <div class="cart-count">0</div>
    </button>

    <script>
        // ⚠️ আপনার গুগল অ্যাপস স্ক্রিপ্ট থেকে পাওয়া লাইভ Web App URL টি নিচের ডাবল কোটেশনের ("") মাঝে বসাবেন
        const GOOGLE_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzz4AMvpoY8sx1uHD29mdTck9l_56k-gU3azZdZb4m5iGse0gvfH2GUjkXBBLt3vZ9_/exec";

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "অর্ডার প্রসেস হচ্ছে...";
            submitBtn.disabled = true;

            // ফর্মের সমস্ত ডেটা অবজেক্ট আকারে সাজানো
            const orderData = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                email: document.getElementById('custEmail').value,
                address: document.getElementById('custAddress').value,
                items: document.getElementById('productItems').value,
                totalBill: document.getElementById('totalBill').value,
                advanceAmount: document.getElementById('advanceAmount').value,
                paymentInfo: document.getElementById('paymentInfo').value,
                staffCode: document.getElementById('staffCode').value
            };

            // গুগল অ্যাপস স্ক্রিপ্ট এপিআই-তে ডেটা পাঠানো (CORS নিরাপদ পদ্ধতি)
            fetch(GOOGLE_SCRIPT_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // ব্রাউজারের CORS সমস্যা দূর করার জন্য
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(orderData)
            })
            .then(() => {
                alert("🎉 অভিনন্দন! আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে এবং একটি কনফার্মেশন মেইল পাঠানো হয়েছে।");
                document.getElementById('orderForm').reset();
                submitBtn.innerText = "অর্ডার প্লেস করুন";
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error("Error!", error.message);
                alert("দুঃখিত, কোনো একটি সমস্যায় অর্ডারটি সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।");
                submitBtn.innerText = "অর্ডার প্লেস করুন";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
